[project]
name = "engineering-policy"
version = "1.0.0"
description = "Canonical engineering policy renderer and secure consumer synchronizer"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "fastjsonschema==2.22.1",
  "PyYAML==6.0.3",
]

[project.scripts]
policyctl = "engineering_policy.cli:main"

[dependency-groups]
dev = [
  "jsonschema>=4.25.0,<5",
  "pytest>=8.4.1,<9",
  "ruff>=0.12.7,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engineering_policy"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
